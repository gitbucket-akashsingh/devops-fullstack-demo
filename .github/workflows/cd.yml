name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy using Docker Compose
        run: |
          docker pull yourdockerhub/devops-backend:${{ github.sha }}
          docker pull yourdockerhub/devops-frontend:${{ github.sha }}
          docker-compose up -d
