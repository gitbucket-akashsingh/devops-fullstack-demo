name: CI Pipeline

on:
    push:
        branches:
            - dev
            - main
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # ---------- Backend ----------
            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Build backend
              working-directory: backend
              run: mvn clean package

            # ---------- Frontend ----------
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm install

            - name: Build frontend
              working-directory: frontend
              run: npm run build

            # ---------- Docker ----------
            - name: Build backend image
              run: docker build -t devops-backend:${{ github.sha }} -f docker/backend/Dockerfile .

            - name: Build frontend image
              run: docker build -t devops-frontend:${{ github.sha }} -f docker/frontend/Dockerfile .

            # ---------- Security ----------
            - name: Scan backend image
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: devops-backend:${{ github.sha }}

            - name: Scan frontend image
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: devops-frontend:${{ github.sha }}

                  # ---------- Dockehub pushing images ----------
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Push backend image
              run: docker tag devops-backend:${{ github.sha }} yourdockerhub/devops-backend:${{ github.sha }}docker push yourdockerhub/devops-backend:${{ github.sha }}

            - name: Push frontend image
              run: docker tag devops-frontend:${{ github.sha }} yourdockerhub/devops-frontend:${{ github.sha }}docker push yourdockerhub/devops-frontend:${{ github.sha }}
